<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能助手</title>

  <!-- Google Fonts for Chinese -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- highlight.js (light theme for Forest Canopy) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <!-- marked.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>

  <!-- DOMPurify -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>

  <!-- App styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <!-- Sidebar backdrop (mobile) -->
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="brand-lockup">
          <h1 class="logo">智能助手</h1>
          <span class="beta-badge">测试版</span>
        </div>
        <button id="new-chat-btn" title="新建对话">+ 新建对话</button>
      </div>
      <div id="conversation-list" class="conversation-list"></div>
    </aside>

    <!-- Main Chat Area -->
    <main id="chat-area">
      <!-- Chat Header -->
      <header id="chat-header">
        <div class="header-left">
          <button id="sidebar-toggle" class="mobile-only" title="切换侧边栏">&#9776;</button>
          <h2 id="chat-title">智能助手</h2>
          <span class="beta-badge beta-badge-inline">测试版</span>
        </div>
        <div class="header-right">
          <span id="connection-status" class="status-indicator disconnected" title="未连接"></span>
        </div>
      </header>

      <!-- Messages -->
      <div id="messages" class="messages">
        <div id="welcome">
          <div class="welcome-icon">
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M32 4C32 4 20 18 20 32C20 40 24 48 32 56C40 48 44 40 44 32C44 18 32 4 32 4Z" fill="#a4ac86" opacity="0.3"/>
              <path d="M32 8C32 8 22 20 22 32C22 39 25.5 46 32 53C38.5 46 42 39 42 32C42 20 32 8 32 8Z" stroke="#a4ac86" stroke-width="2" fill="none"/>
              <line x1="32" y1="20" x2="32" y2="50" stroke="#a4ac86" stroke-width="1.5"/>
              <path d="M32 28C28 24 25 26 24 28" stroke="#a4ac86" stroke-width="1.5" fill="none"/>
              <path d="M32 36C36 32 39 34 40 36" stroke="#a4ac86" stroke-width="1.5" fill="none"/>
            </svg>
          </div>
          <h2>今天有什么可以帮您？</h2>
          <div class="prompt-chips">
            <button class="prompt-chip" data-prompt="Write an email">撰写邮件</button>
            <button class="prompt-chip" data-prompt="Explain a concept">解释概念</button>
            <button class="prompt-chip" data-prompt="Analyze data">分析数据</button>
            <button class="prompt-chip" data-prompt="Write code">编写代码</button>
          </div>
        </div>
      </div>

      <!-- Input Bar -->
      <div id="input-bar">
        <textarea
          id="message-input"
          placeholder="输入消息..."
          rows="1"
          disabled
        ></textarea>
        <button id="cancel-btn" class="hidden" title="停止">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"></rect>
          </svg>
        </button>
        <button id="send-btn" disabled title="发送消息">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 2L11 13"></path>
            <path d="M22 2L15 22L11 13L2 9L22 2Z"></path>
          </svg>
        </button>
      </div>
    </main>

    <!-- Floating todo panel -->
    <div id="todo-panel" class="todo-panel hidden">
      <div class="todo-panel-header">
        <span class="todo-panel-label">任务列表</span>
        <span id="todo-progress" class="todo-panel-progress"></span>
        <button id="todo-close" title="关闭">&times;</button>
      </div>
      <div class="todo-panel-bar">
        <div id="todo-bar-fill" class="todo-panel-bar-fill"></div>
      </div>
      <div id="todo-list" class="todo-panel-list"></div>
    </div>

    <!-- Plan overlay (hidden by default) -->
    <div id="plan-overlay" class="plan-overlay hidden">
      <div class="plan-overlay-modal">
        <h3 class="plan-overlay-title">以下是我的计划</h3>
        <div id="plan-overlay-content" class="plan-overlay-content"></div>
        <div class="plan-overlay-actions">
          <button id="plan-go-ahead-btn" class="approval-btn allow">批准执行</button>
          <button id="plan-change-btn" class="approval-btn skip">我想修改</button>
        </div>
        <div class="plan-overlay-feedback hidden" id="plan-overlay-feedback">
          <textarea id="plan-change-input" placeholder="您希望如何修改？" rows="3"></textarea>
          <button id="plan-change-submit" class="approval-btn allow">发送</button>
        </div>
      </div>
    </div>
  </div>

  <!-- App modules -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
