services:
  agent:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: "sqlite+aiosqlite:///./data/agent.db"
      SKILLS_DIR: "skills"
      WORKSPACE_DIR: "workspace"
    volumes:
      - ./data:/app/data
      - ./skills:/app/skills
      - ./workspace:/app/workspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
